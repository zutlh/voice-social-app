version: '3.8'

services:
  mysql-master:
    image: mysql:8.0
    container_name: voice-mysql-master
    environment:
      MYSQL_ROOT_PASSWORD: root123
      MYSQL_DATABASE: voice_social
      MYSQL_USER: voice
      MYSQL_PASSWORD: voice123
    ports:
      - "3306:3306"
    volumes:
      - mysql-master-data:/var/lib/mysql
      - ./mysql/init.sql:/docker-entrypoint-initdb.d/init.sql
      - ./mysql/my.cnf:/etc/mysql/conf.d/my.cnf
    command: --server-id=1 --log-bin=mysql-bin --binlog-do-db=voice_social
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  mysql-slave:
    image: mysql:8.0
    container_name: voice-mysql-slave
    environment:
      MYSQL_ROOT_PASSWORD: root123
      MYSQL_DATABASE: voice_social
    ports:
      - "3307:3306"
    volumes:
      - mysql-slave-data:/var/lib/mysql
      - ./mysql/my.cnf:/etc/mysql/conf.d/my.cnf
    command: --server-id=2 --relay-log=mysql-relay-bin --read-only=1
    depends_on:
      mysql-master:
        condition: service_healthy

  redis-master:
    image: redis:7-alpine
    container_name: voice-redis-master
    ports:
      - "6379:6379"
    command: redis-server --requirepass redis123
    volumes:
      - redis-master-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "redis123", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis-slave-1:
    image: redis:7-alpine
    container_name: voice-redis-slave-1
    ports:
      - "6380:6379"
    command: redis-server --requirepass redis123 --replicaof redis-master 6379 --masterauth redis123
    volumes:
      - redis-slave-1-data:/data
    depends_on:
      redis-master:
        condition: service_healthy

  redis-slave-2:
    image: redis:7-alpine
    container_name: voice-redis-slave-2
    ports:
      - "6381:6379"
    command: redis-server --requirepass redis123 --replicaof redis-master 6379 --masterauth redis123
    volumes:
      - redis-slave-2-data:/data
    depends_on:
      redis-master:
        condition: service_healthy

  rocketmq-namesrv:
    image: apache/rocketmq:5.1.4
    container_name: voice-rmq-namesrv
    ports:
      - "9876:9876"
    command: sh mqnamesrv
    volumes:
      - rocketmq-namesrv-data:/home/rocketmq/store

  rocketmq-broker:
    image: apache/rocketmq:5.1.4
    container_name: voice-rmq-broker
    ports:
      - "10909:10909"
      - "10911:10911"
    environment:
      JAVA_OPT_EXT: "-server -Xms512m -Xmx512m"
    command: sh mqbroker -n rocketmq-namesrv:9876 -c /home/rocketmq/conf/broker.conf
    volumes:
      - rocketmq-broker-data:/home/rocketmq/store
      - ./rocketmq/broker.conf:/home/rocketmq/conf/broker.conf
    depends_on:
      - rocketmq-namesrv

  nginx:
    image: nginx:1.25-alpine
    container_name: voice-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
    depends_on:
      - mysql-master

volumes:
  mysql-master-data:
  mysql-slave-data:
  redis-master-data:
  redis-slave-1-data:
  redis-slave-2-data:
  rocketmq-namesrv-data:
  rocketmq-broker-data:
