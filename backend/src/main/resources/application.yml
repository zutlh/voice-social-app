server:
  port: 8080

spring:
  application:
    name: voice-social

  datasource:
    url: jdbc:mysql://localhost:3306/voice_social?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai&characterEncoding=utf8mb4
    username: voice
    password: voice123
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5

  data:
    redis:
      host: localhost
      port: 6379
      password: redis123
      lettuce:
        pool:
          max-active: 20
          max-idle: 10
          min-idle: 5

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

rocketmq:
  name-server: localhost:9876
  producer:
    group: voice-producer-group
  consumer:
    group: voice-consumer-group

agora:
  app-id: ${AGORA_APP_ID:}
  app-certificate: ${AGORA_APP_CERTIFICATE:}
  token-expiration-seconds: 86400

jwt:
  access-token-expiration: 900
  refresh-token-expiration: 604800
  secret: ${JWT_SECRET:voice-social-jwt-secret-key-change-in-production}

logging:
  level:
    com.voiceapp: DEBUG
